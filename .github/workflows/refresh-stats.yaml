name: refresh-stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: crawl github
        run: python tools/refresh_stats.py data.js
      - name: commit baked stats
        run: |
          git config user.name  "cho-stats-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "stats: live refresh $(date -u +%Y-%m-%dT%H:%M)"
          git push
